services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cinemapedia
      POSTGRES_USER: cinemapedia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - cinema_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cinemapedia"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PGHOST: db
      PGDATABASE: cinemapedia
      PGUSER: cinemapedia
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
volumes:
  cinema_db:
